name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Extract version and metadata from tag
        id: meta
        run: |
          # Strip the leading 'v' from the tag name (e.g. v1.0.0 -> 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          # Lowercase repository owner for Docker tag naming requirement
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/student-ml-api"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with OCI metadata labels
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.VERSION }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}" \
            --label "org.opencontainers.image.title=student-ml-api" \
            -t ${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }} \
            -t ${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.SHORT_SHA }} \
            -t ${{ steps.meta.outputs.IMAGE_NAME }}:latest \
            .

      - name: Push versioned image tag
        run: docker push ${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}

      - name: Push commit SHA image tag
        run: docker push ${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}

      - name: Push latest image tag
        run: docker push ${{ steps.meta.outputs.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | ${GITHUB_REF_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Version | ${{ steps.meta.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA Tag | ${{ steps.meta.outputs.SHORT_SHA }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | ${{ steps.meta.outputs.BUILD_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ steps.meta.outputs.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY

